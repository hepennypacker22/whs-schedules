name: Sync scores & team info

on:
  schedule:
    # Every 3 hours (UTC). GitHub may delay scheduled runs slightly.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scores
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch scores from MaxPreps
        run: node scripts/fetch-scores.mjs
      - name: Fetch coaches & trophy case from the Google Docs
        id: teaminfo
        # Don't let a docs hiccup block the score sync — the script leaves the
        # existing teaminfo.json in place, the commit below still runs, and the
        # failure is re-raised at the end of the job so the run goes red.
        # (It used to only emit ::warning::, which kept the run green: link
        # sharing on both docs was off from 2026-08-31 to 09-18 unnoticed.)
        continue-on-error: true
        run: node scripts/fetch-teaminfo.mjs
      - name: Commit if changed
        run: |
          if ! git diff --quiet data/ 2>/dev/null; then
            git config user.name "whs-schedules-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/
            git commit -m "Sync scores and team info"
            git push
          else
            echo "No changes."
          fi
      - name: Grid column health check
        # Fails the run (visible red X, no effect on the commits above) when a
        # configured team column can't be found in a grid — e.g. a header was
        # renamed. Add the new spelling to that team's aliases in config.js.
        run: node scripts/test-parser.mjs
      - name: Re-raise teaminfo sync failure
        # Last, so the score commit and the grid check above always happen first.
        if: ${{ !cancelled() && steps.teaminfo.outcome == 'failure' }}
        run: |
          echo "::error::Coaches/trophy sync failed - see the \"Fetch coaches & trophy case\" step. The previous data/teaminfo.json is still being served."
          exit 1
